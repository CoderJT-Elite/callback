<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; src: url('assets/fonts/IBMPlexMono-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 700; src: url('assets/fonts/IBMPlexMono-Bold.ttf') format('truetype'); }
        @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; src: url('assets/fonts/IBMPlexSans-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; src: url('assets/fonts/IBMPlexSans-SemiBold.ttf') format('truetype'); }
        @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 400; src: url('assets/fonts/Newsreader-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 600; src: url('assets/fonts/Newsreader-SemiBold.ttf') format('truetype'); }

        #root {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 40px 80px;
          font-family: 'IBM Plex Sans', sans-serif;
          color: #1C1A17;
        }

        .ledger-card {
          background: #FBF8F1;
          border: 2px solid #1C1A17;
          box-shadow: 8px 8px 0 #1C1A17;
          padding: 32px;
        }

        .inner-container {
          width: 100%;
          max-width: 1400px;
          display: flex;
          flex-direction: column;
          gap: 32px;
        }

        .scene-header {
          text-align: center;
        }

        .header-title {
          font-family: 'Newsreader', serif;
          font-size: 44px;
          font-weight: 600;
          margin-bottom: 8px;
        }

        .header-sub {
          font-size: 18px;
          color: #6B655A;
          font-family: 'IBM Plex Mono', monospace;
        }

        .comparison-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 40px;
        }

        .box-chat {
          border-top: 6px solid #4A4A48;
        }

        .box-callback {
          border-top: 6px solid #1F6A4B;
        }

        .box-title {
          font-family: 'IBM Plex Mono', monospace;
          font-size: 14px;
          font-weight: 700;
          margin-bottom: 16px;
        }

        .chat-sample {
          padding: 16px;
          background: #F3EEE4;
          border: 1px solid #D9D1C1;
          margin-bottom: 16px;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 14px;
        }

        .callback-lockup {
          display: flex;
          align-items: center;
          gap: 16px;
          padding: 16px;
          background: #F3EEE4;
          border: 1px solid #D9D1C1;
          margin-bottom: 16px;
        }

        .bullets-list {
          list-style: none;
          display: flex;
          flex-direction: column;
          gap: 12px;
          font-size: 16px;
        }
      </style>

      <div id="root" data-composition-id="scene-2" data-width="1920" data-height="1080">
        <div class="inner-container">
          <div class="scene-header">
            <div id="s2-title" class="header-title">The Problem With Asking an AI Chatbot</div>
            <div id="s2-subtitle" class="header-sub">"Is this message a scam?" — a chatbot answer is a verdict you can't check</div>
          </div>

          <div class="comparison-grid">
            <div id="s2-chat-card" class="ledger-card box-chat">
              <div class="box-title" style="color: #4A4A48;">A TYPICAL CHATBOT ANSWER (ILLUSTRATIVE)</div>
              <div class="chat-sample">
                User: "Is this $1.99 USPS text a scam?"<br/>
                AI: "This looks like a scam." (no sources shown)
              </div>
              <ul class="bullets-list">
                <li style="color: #C23B22;">✗ A judgment, not evidence you can check</li>
                <li style="color: #C23B22;">✗ No built-in step that looks up the sender's real contact details</li>
                <li style="color: #C23B22;">✗ Can sound just as sure when it is wrong</li>
              </ul>
            </div>

            <div id="s2-cb-card" class="ledger-card box-callback">
              <div class="box-title" style="color: #1F6A4B;">CALLBACK ARCHITECTURE</div>
              <div class="callback-lockup">
                <img src="assets/icon.svg" style="width: 40px; height: 40px;" alt="Callback" />
                <div>
                  <div style="font-weight: 600; font-size: 16px;">Ground-Truth Channel Verification</div>
                  <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B655A;">Deterministic 7-Rule Engine</div>
                </div>
              </div>
              <ul class="bullets-list">
                <li style="color: #1F6A4B;">✓ Looks up official domains from sources scammers don't control</li>
                <li style="color: #1F6A4B;">✓ Verifies RDAP domain age, lookalikes, and official contact pages</li>
                <li style="color: #1F6A4B;">✓ Fixed rules decide verdicts; AI only cites verified evidence</li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s2-title", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 0.2);
        tl.fromTo("#s2-subtitle", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5 }, 0.4);
        tl.fromTo("#s2-chat-card", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6 }, 0.8);
        tl.fromTo("#s2-cb-card", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6 }, 1.3);
        window.__timelines = window.__timelines || {};
        window.__timelines["scene-2"] = tl;
      </script>
    </template>
  </body>
</html>
