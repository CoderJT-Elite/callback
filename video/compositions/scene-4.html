<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; src: url('assets/fonts/IBMPlexMono-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 700; src: url('assets/fonts/IBMPlexMono-Bold.ttf') format('truetype'); }
        @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; src: url('assets/fonts/IBMPlexSans-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; src: url('assets/fonts/IBMPlexSans-SemiBold.ttf') format('truetype'); }
        @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 400; src: url('assets/fonts/Newsreader-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 600; src: url('assets/fonts/Newsreader-SemiBold.ttf') format('truetype'); }

        #root {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 40px 80px;
          font-family: 'IBM Plex Sans', sans-serif;
          color: #1C1A17;
        }

        .ledger-card {
          background: #FBF8F1;
          border: 2px solid #1C1A17;
          box-shadow: 8px 8px 0 #1C1A17;
          padding: 32px;
        }

        .scene-grid {
          width: 100%;
          max-width: 1400px;
          display: grid;
          grid-template-columns: 1fr 1.1fr;
          gap: 40px;
          align-items: center;
        }

        .ui-frame {
          padding: 0;
          overflow: hidden;
          height: 560px;
          display: flex;
          flex-direction: column;
        }

        .ui-header {
          background: #F3EEE4;
          padding: 12px 20px;
          border-bottom: 1.5px solid #1C1A17;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 12px;
          display: flex;
          justify-content: space-between;
        }

        .ui-screen {
          flex: 1;
          position: relative;
          background: #fff;
          overflow: hidden;
        }

        .ui-screen img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          object-position: top center;
        }

        .rubber-stamp {
          display: inline-block;
          border: 4px solid #1F6A4B;
          outline: 1.5px solid #1F6A4B;
          outline-offset: 4px;
          padding: 8px 24px;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 32px;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #1F6A4B;
          transform: rotate(-3deg);
          margin-bottom: 16px;
        }

        .verdict-title {
          font-family: 'Newsreader', serif;
          font-size: 26px;
          font-weight: 600;
          line-height: 1.3;
          margin-bottom: 12px;
        }

        .desc-text {
          font-size: 16px;
          line-height: 1.5;
          margin-bottom: 16px;
        }

        .highlight-callout {
          padding: 12px;
          background: #F3EEE4;
          border-left: 4px solid #1F6A4B;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 13px;
        }
      </style>

      <div id="root" data-composition-id="scene-4" data-width="1920" data-height="1080">
        <div class="scene-grid">
          <div id="s4-card-info" class="ledger-card">
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B655A; margin-bottom: 8px;">
              LEGITIMATE VERIFICATION CONTRAST
            </div>
            <div id="s4-stamp-element" class="rubber-stamp">
              ✓ MATCHES
            </div>
            <div class="verdict-title">
              Rule 5: All Official Channels Match
            </div>
            <div class="desc-text">
              Callback doesn't cry scam on everything. When you receive a real fraud alert from your bank—like Wells Fargo—it verifies the phone number and domain against the bank's own official contact page.
            </div>
            <div class="highlight-callout">
              Verified phone: 1-800-869-3557 matched on official contact directory. Green stamp: MATCHES.
            </div>
          </div>

          <div id="s4-ui-frame" class="ledger-card ui-frame">
            <div class="ui-header">
              <span>SAVED EXAMPLE · WELLS FARGO FRAUD ALERT</span>
              <span style="color: #1F6A4B;">● RULE_5_ALL_OFFICIAL_MATCH</span>
            </div>
            <div class="ui-screen">
              <img src="assets/stills/03-sample-bank-matches.png" alt="Wells Fargo Official Match" />
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s4-card-info", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6 }, 0.2);
        tl.fromTo("#s4-ui-frame", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6 }, 0.6);
        tl.fromTo("#s4-stamp-element", { scale: 1.4, opacity: 0, rotation: 8 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.35, ease: "back.out(2)" }, 1.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["scene-4"] = tl;
      </script>
    </template>
  </body>
</html>
