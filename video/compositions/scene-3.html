<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; src: url('assets/fonts/IBMPlexMono-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 700; src: url('assets/fonts/IBMPlexMono-Bold.ttf') format('truetype'); }
        @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; src: url('assets/fonts/IBMPlexSans-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; src: url('assets/fonts/IBMPlexSans-SemiBold.ttf') format('truetype'); }
        @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 400; src: url('assets/fonts/Newsreader-Regular.ttf') format('truetype'); }
        @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 600; src: url('assets/fonts/Newsreader-SemiBold.ttf') format('truetype'); }

        #root {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 40px 80px;
          font-family: 'IBM Plex Sans', sans-serif;
          color: #1C1A17;
        }

        .ledger-card {
          background: #FBF8F1;
          border: 2px solid #1C1A17;
          box-shadow: 8px 8px 0 #1C1A17;
          padding: 32px;
        }

        .scene-grid {
          width: 100%;
          max-width: 1400px;
          display: grid;
          grid-template-columns: 1.1fr 1fr;
          gap: 40px;
          align-items: center;
        }

        .ui-frame {
          padding: 0;
          overflow: hidden;
          height: 560px;
          display: flex;
          flex-direction: column;
        }

        .ui-header {
          background: #F3EEE4;
          padding: 12px 20px;
          border-bottom: 1.5px solid #1C1A17;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 12px;
          display: flex;
          justify-content: space-between;
        }

        .ui-screen {
          flex: 1;
          position: relative;
          background: #fff;
          overflow: hidden;
        }

        .ui-screen img {
          width: 100%;
          height: 100%;
          object-fit: contain;
          object-position: top center;
        }

        .rubber-stamp {
          display: inline-block;
          border: 4px solid #C23B22;
          outline: 1.5px solid #C23B22;
          outline-offset: 4px;
          padding: 8px 24px;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 32px;
          font-weight: 700;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #C23B22;
          transform: rotate(-3deg);
          margin-bottom: 16px;
        }

        .verdict-title {
          font-family: 'Newsreader', serif;
          font-size: 26px;
          font-weight: 600;
          line-height: 1.3;
          margin-bottom: 12px;
        }

        .verdict-desc {
          font-size: 15px;
          color: #6B655A;
          line-height: 1.5;
        }

        .ledger-row {
          display: flex;
          justify-content: space-between;
          border-bottom: 1px solid #D9D1C1;
          padding-bottom: 6px;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 13px;
        }
      </style>

      <div id="root" data-composition-id="scene-3" data-width="1920" data-height="1080">
        <div class="scene-grid">
          <div id="s3-ui-frame" class="ledger-card ui-frame">

            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 20px;">
            <div id="s3-card-receipt" class="ledger-card">
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B655A; margin-bottom: 8px;">
                OFFICIAL VERDICT RECEIPT
              </div>
              <div id="s3-stamp-element" class="rubber-stamp">
                ✗ DOESN'T MATCH
              </div>
              <div class="verdict-title">
                Rule 3: Strong Mismatch Against USPS
              </div>
              <div class="verdict-desc">
                Claimed entity: <strong>United States Postal Service</strong>.<br/>
                Official verified domain: <code style="background: #F3EEE4; padding: 2px 6px;">usps.com</code>.
              </div>
            </div>

            <div id="s3-ledger-card" class="ledger-card" style="display: flex; flex-direction: column; gap: 10px;">
              <div class="ledger-row">
                <span>[E1] Link domain check:</span>
                <span style="color: #C23B22; font-weight: 700;">usps-redelivery-notice.xyz ✗</span>
              </div>
              <div class="ledger-row">
                <span>[E2] Lookalike brand score:</span>
                <span style="color: #C23B22; font-weight: 700;">Impersonates "usps" ✗</span>
              </div>
              <div class="ledger-row">
                <span>[E3] RDAP registration:</span>
                <span style="color: #C23B22; font-weight: 700;">Not registered domain ✗</span>
              </div>
              <div class="ledger-row" style="border-bottom: none; padding-top: 4px;">
                <span>[E4] Real official portal:</span>
                <span style="color: #1F6A4B; font-weight: 700;">tools.usps.com ✓</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s3-ui-frame", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6 }, 0.2);
        tl.fromTo("#s3-card-receipt", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6 }, 0.6);
        tl.fromTo("#s3-stamp-element", { scale: 1.4, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.35, ease: "back.out(2)" }, 1.5);
        tl.fromTo("#s3-ledger-card", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, 2.2);
        window.__timelines = window.__timelines || {};
        window.__timelines["scene-3"] = tl;
      </script>
    </template>
  </body>
</html>
