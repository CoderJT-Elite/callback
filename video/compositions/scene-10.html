<!doctype html>

    <meta charset="UTF-8" />

    <template>

        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; src: url('assets/fonts/IBMPlexMono-Regular.ttf') format('truetype'); }

        #root {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 40px 80px;
          font-family: 'IBM Plex Sans', sans-serif;
          color: #1C1A17;
        }

        .ledger-card {
          background: #FBF8F1;
          border: 2px solid #1C1A17;
          box-shadow: 8px 8px 0 #1C1A17;
          padding: 32px;

        .inner-container {
          width: 100%;
          max-width: 1300px;
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .brand-header {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 20px;
          margin-bottom: 16px;
        }

        .brand-header img {
          width: 56px;
          height: 56px;
        }

        .brand-name {
          font-family: 'Newsreader', serif;
          font-size: 56px;
          font-weight: 600;
        }

        .brand-tagline {
          font-family: 'Newsreader', serif;
          font-size: 26px;
          font-style: italic;
          color: #6B655A;
          margin-bottom: 24px;
        }

        .endcard-box {
          text-align: left;
          max-width: 800px;
          width: 100%;
        }

        .links-row {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 24px;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 14px;
          margin-bottom: 16px;
        }

        .disclosure-text {
          border-top: 1px dashed #D9D1C1;
          padding-top: 12px;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 12px;
          color: #6B655A;
          line-height: 1.5;

      <div id="root" data-composition-id="scene-10" data-width="1920" data-height="1080">

          <div class="brand-header">

          </div>
          <div class="brand-tagline">
            "Don't trust the number in the message. Callback finds the real one."

          <div class="ledger-card endcard-box">
            <div class="links-row">
              <div>
                <span style="color: #6B655A;">REPOSITORY:</span><br/>
                <strong>github.com/CoderJT-Elite/callback</strong>
              </div>
              <div>
                <span style="color: #6B655A;">LIVE DEMO:</span><br/>
                <strong>callback-lac.vercel.app</strong>
              </div>
            </div>
            <div class="disclosure-text">
              <strong>AI DISCLOSURE:</strong> Built for ForgeHacks 2026 by solo student John Tewolde with AI coding assistants. Runtime Gemini 3.5 Flash Lite reads messages; fixed deterministic rules decide verdicts.

          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s10-container", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.8 }, 0.2);
        window.__timelines = window.__timelines || {};
        window.__timelines["scene-10"] = tl;
