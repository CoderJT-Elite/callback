  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; src: url('assets/fonts/IBMPlexMono-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 700; src: url('assets/fonts/IBMPlexMono-Bold.ttf') format('truetype'); }
      @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; src: url('assets/fonts/IBMPlexSans-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; src: url('assets/fonts/IBMPlexSans-SemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 400; src: url('assets/fonts/Newsreader-Regular.ttf') format('truetype'); }
      @font-face { font-family: 'Newsreader'; font-style: normal; font-weight: 600; src: url('assets/fonts/Newsreader-SemiBold.ttf') format('truetype'); }

      :root {
        --paper: #F3EEE4;
        --sheet: #FBF8F1;
        --ink: #1C1A17;
        --muted: #6B655A;
        --rule: #D9D1C1;
        --stamp: #C23B22;
        --pine: #1F6A4B;
        --ochre: #96640A;
        --graphite: #4A4A48;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: 'IBM Plex Sans', sans-serif;
      }

      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: var(--paper);
        overflow: hidden;
      }

      .paper-bg {
        position: absolute;
        inset: 0;
        background-color: var(--paper);
        background-image: 
          linear-gradient(to right, rgba(217, 209, 193, 0.25) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(217, 209, 193, 0.25) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }

      .top-banner {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 72px;
        border-bottom: 2px solid var(--ink);
        background: var(--sheet);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 48px;
        z-index: 100;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand-lockup img {
        width: 32px;
        height: 32px;
      }

      .brand-title {
        font-family: 'Newsreader', serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .brand-tag {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        padding-left: 12px;
        border-left: 1px solid var(--rule);
      }

      .header-meta {
        display: flex;
        align-items: center;
        gap: 24px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
      }

      .time-chip {
        padding: 4px 12px;
        background: var(--paper);
        border: 1px solid var(--ink);
        font-weight: 600;
      }

      .progress-container {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 8px;
        background: var(--rule);
        z-index: 100;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: var(--stamp);
      }

      .captions-bar {
        position: absolute;
        bottom: 24px;
        left: 80px;
        right: 80px;
        min-height: 54px;
        background: var(--sheet);
        border: 1.5px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 32px;
        z-index: 95;
        text-align: center;
      }

      .caption-text {
        font-family: 'Newsreader', serif;
        font-size: 24px;
        line-height: 1.3;
        font-weight: 500;
        color: var(--ink);
      }

      .scene-slot {
        position: absolute;
        inset: 0;
      }

      #pip {
        position: absolute;
        right: 56px;
        bottom: 112px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 3px solid var(--ink);
        box-shadow: 5px 5px 0 var(--ink);
        background: var(--sheet);
        overflow: hidden;
        z-index: 90;
        opacity: 0;
        transform-origin: 100% 100%;
      }
      #pip video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #pip .shape {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Newsreader', serif;
        font-size: 104px;
        font-weight: 600;
        color: var(--ink);
        background: var(--paper);
      }
    </style>
  </head>

      <!-- Persistent Captions Bar -->
      <div id="captions-container" class="captions-bar">
        <div id="caption-label" class="caption-text">
          Callback: Ground-truth imposter scam verification.
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div id="main-progress-bar" class="progress-bar"></div>
      </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#main-progress-bar", { width: "100%", duration: 211.29, ease: "none" }, 0);

      const captionLabel = document.getElementById("caption-label");
      const captionsData = [
        {
          "start": 0.4,
          "text": "This text claims it's from the Postal Service, asking for a two-dollar redelivery fee."
        },
        {
          "start": 6.48,
          "text": "Is it real? Imposter scams were nearly one in three fraud reports to the FTC in 2025,"
        },
        {
          "start": 12.24,
          "text": "with 3.5 billion dollars in reported losses."
        },
        {
          "start": 15.92,
          "text": "When you get a text like this, how do you check it?"
        },
        {
          "start": 19.28,
          "text": "The standard advice is to contact the company yourself."
        },
        {
          "start": 22.8,
          "text": "But if you paste a suspicious message into an AI chatbot,"
        },
        {
          "start": 27.12,
          "text": "you get a verdict with nothing you can check."
        },
        {
          "start": 29.6,
          "text": "Scammers use AI too, so good grammar proves nothing. Meet Callback."
        },
        {
          "start": 35.76,
          "text": "Instead of guessing, Callback runs a live investigation."
        },
        {
          "start": 40.08,
          "text": "We paste the message and click Check it."
        },
        {
          "start": 43.28,
          "text": "Callback works out who the message claims to be, here the US Postal Service,"
        },
        {
          "start": 48.56,
          "text": "from a hand-checked list of official organizations, never from the message itself."
        },
        {
          "start": 53.84,
          "text": "Then it compares the message's link with the real domain, usps.com."
        },
        {
          "start": 58.56,
          "text": "The link isn't official, it contains the brand name, and the domain isn't registered."
        },
        {
          "start": 64.05,
          "text": "The verdict: doesn't match."
        },
        {
          "start": 66.61,
          "text": "Callback doesn't just cry scam on everything."
        },
        {
          "start": 70.13,
          "text": "When you get a real fraud alert from your bank, like Wells Fargo,"
        },
        {
          "start": 74.45,
          "text": "it confirms the link is on wellsfargo.com and checks the phone number"
        },
        {
          "start": 79.57,
          "text": "against Wells Fargo's own contact page. The verdict: it matches."
        },
        {
          "start": 84.13,
          "text": "That matters, because false alarms teach people to ignore real warnings."
        },
        {
          "start": 89.81,
          "text": "Callback also reads screenshots."
        },
        {
          "start": 92.61,
          "text": "Drop in an image of a suspicious text, and Gemini vision reads the message."
        },
        {
          "start": 98.21,
          "text": "Then a guard re-checks the result and drops anything the AI invented"
        },
        {
          "start": 103.09,
          "text": "that isn't really in the image."
        },
        {
          "start": 106.05,
          "text": "If someone already clicked the link or replied, panic makes people freeze."
        },
        {
          "start": 111.33,
          "text": "Callback's incident panel gives a checklist for what to do next, based on how they paid,"
        },
        {
          "start": 117.25,
          "text": "and downloads an incident summary with the evidence,"
        },
        {
          "start": 120.61,
          "text": "ready to paste into a report for the FTC."
        },
        {
          "start": 124.62,
          "text": "Here is what makes Callback different: the AI never decides the verdict."
        },
        {
          "start": 130.22,
          "text": "Gemini only reads messy text and writes the plain-English explanation,"
        },
        {
          "start": 135.02,
          "text": "and every sentence has to cite a numbered piece of evidence, like E1, or it gets dropped."
        },
        {
          "start": 141.42,
          "text": "Seven fixed rules decide whether the contact details match."
        },
        {
          "start": 146.54,
          "text": "We tested this on 35 synthetic messages that we made up for this project."
        },
        {
          "start": 151.9,
          "text": "Gemini alone flagged all 20 scams, but it also called a real payment receipt a scam, and showed no evidence."
        },
        {
          "start": 160.06,
          "text": "Callback caught 15 of the 20 scams, with zero false alarms,"
        },
        {
          "start": 165.34,
          "text": "backed 74 of 80 explanation sentences with evidence,"
        },
        {
          "start": 169.5,
          "text": "and abstained on 10 of the 35 messages instead of guessing."
        },
        {
          "start": 176.38,
          "text": "Callback is honest about its limits. It covers US numbers and 27 hand-checked organizations."
        },
        {
          "start": 183.5,
          "text": "A phone number can only be confirmed where the organization publishes it."
        },
        {
          "start": 188.25,
          "text": "If an organization isn't on the list, or its site blocks automated checks,"
        },
        {
          "start": 193.45,
          "text": "Callback says it can't verify, instead of guessing."
        },
        {
          "start": 197.45,
          "text": "I'm John Tewolde, and this is Callback."
        },
        {
          "start": 200.41,
          "text": "Try it live at callback-lac.vercel.app."
        },
        {
          "start": 206.17,
          "text": "Don't trust the number in the message. Callback finds the real one."
        }
      ];

      captionsData.forEach(c => {
        tl.call(() => {
          if (captionLabel) captionLabel.textContent = c.text;
        }, null, c.start);
      });

      const timeDisplay = document.getElementById("time-display");
      const TOTAL = 211.29;
      const fmt = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s % 60)).padStart(2, "0");
      for (let t = 0; t <= Math.ceil(TOTAL); t++) {
        const label = fmt(t) + " / " + fmt(TOTAL);
        tl.call(() => { if (timeDisplay) timeDisplay.textContent = label; }, null, t);
      }
      // Circle (John's video, or a monogram until a recording exists): big in the hook and closing, small during the demo.
      tl.fromTo("#pip", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.45, duration: 0.6, ease: "back.out(1.6)" }, 0.4);
      tl.to("#pip", { scale: 1, duration: 0.7, ease: "power2.inOut" }, 19.03);
      tl.to("#pip", { scale: 1.45, duration: 0.7, ease: "power2.inOut" }, 197.2);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
