<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Callback demo video stage</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--paper:#f3eee4;--panel:#fbf8f1;--ink:#1c1a17;--steel:#6b655a;--rule:#d9d1c1;--red:#c23b22;--teal:#1f6a4b;--amber:#b07a12;
 --sans:"IBM Plex Sans",system-ui,sans-serif;--cond:"Newsreader",Georgia,serif;--mono:"IBM Plex Mono",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper);font-family:var(--sans);color:var(--ink)}
#app{position:relative;width:1920px;height:1080px;overflow:hidden}
#left{position:absolute;left:0;top:0;width:1312px;height:1080px;background:var(--paper)}
/* header */
#head{position:absolute;left:0;top:0;width:1312px;height:104px;border-bottom:3px double var(--ink);background:var(--panel);display:flex;align-items:center;padding:0 48px;gap:22px}
#brand{font:600 38px var(--cond);letter-spacing:-.01em;display:flex;align-items:center;gap:14px}#brand img{height:52px;width:auto}
#label{font:600 20px var(--mono);color:var(--steel);letter-spacing:.08em;text-transform:uppercase;flex:1;padding-left:18px;border-left:2px solid var(--rule)}
#track{display:flex;gap:8px}
.tk{width:34px;height:34px;border:2px solid var(--rule);display:grid;place-items:center;font:600 15px var(--mono);color:var(--steel);background:var(--paper)}
.tk.on{border-color:var(--red);color:var(--red)}.tk.done{background:var(--ink);border-color:var(--ink);color:#fff}
/* stage window */
#win{position:absolute;left:48px;top:132px;width:1216px;height:684px;background:var(--panel);border:3px solid var(--ink);overflow:hidden;box-shadow:8px 8px 0 var(--ink)}
.scene{position:absolute;inset:0;display:none}
.shot{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.shot img{display:block;width:1500px}
.hl{position:absolute;border:4px solid var(--red);background:rgba(194,59,34,.08);pointer-events:none}
.hl b{position:absolute;left:-4px;top:-38px;background:var(--red);color:#fff;font:600 20px var(--mono);padding:4px 10px;white-space:nowrap}
.hl.flip b{top:auto;bottom:-38px}
.hl b:empty{display:none}
/* caption */
#cap{position:absolute;left:48px;top:848px;width:1216px;height:200px;display:flex;flex-direction:column;justify-content:center}
#cap .k{font:500 15px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
#cap .t{font:600 56px/1.04 var(--cond);letter-spacing:-.012em}
#cap .s{font:400 24px/1.35 var(--sans);color:var(--steel);margin-top:10px}
#cap .w{display:inline-block;will-change:transform,opacity}
#wipe{position:absolute;left:0;top:0;width:1312px;height:1080px;pointer-events:none;display:none;z-index:9}
#wipe .ink,#wipe .red{position:absolute;inset:0}
#wipe .ink{background:#1c1a17}#wipe .red{background:var(--red)}
/* panel (placeholder only; the real speaker panel is composed by ffmpeg) */
#panel{position:absolute;left:1312px;top:0;width:608px;height:1080px;background:#1c1a17;color:#f4f5f6;overflow:hidden}
#panel .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red)}
#panel .slate{position:absolute;inset:0;padding:70px 46px 46px 56px;display:flex;flex-direction:column}
#panel .n{font:500 16px var(--mono);letter-spacing:.14em;color:#a39b8c;text-transform:uppercase}
#panel .big{font:700 96px/1 var(--cond);margin:14px 0 22px;color:var(--red)}
#panel .txt{font:500 27px/1.4 var(--sans);color:#ece6d8;overflow:hidden}
#panel .txt mark{background:none;color:#e8745d}
#panel .rec{margin-top:auto;font:500 16px var(--mono);color:#a39b8c;letter-spacing:.08em}
/* custom scene atoms */
.abs{position:absolute}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:76px 76px;opacity:.55}
.mono{font-family:var(--mono)}
.card{position:absolute;background:var(--panel);border:2px solid var(--ink)}
.stamp{position:absolute;border:5px solid var(--red);color:var(--red);font:700 40px var(--mono);letter-spacing:.04em;padding:10px 22px;background:rgba(251,248,241,.94);white-space:nowrap}
.bar{position:absolute;bottom:0;width:100%}
.tape{position:absolute;left:0;right:0;font:400 17px/1.5 var(--mono)}
.tape div{padding:2px 0}.tape b{font-weight:600}
</style></head>
<body><div id="app">
<div id="left">
  <div id="head"><div id="brand"><img src="logo_mark.png" alt="">Callback</div><div id="label"></div><div id="track"></div></div>
  <div id="win"></div>
  <div id="cap"><div class="k"></div><div class="t"></div><div class="s"></div></div>
  <div id="wipe"><div class="ink"></div><div class="red"></div></div>
</div>
<div id="panel"><div class="edge"></div><div class="slate"><div class="n" id="pn"></div><div class="big" id="pb"></div><div class="txt" id="pt"></div><div class="rec">PLACEHOLDER: YOUR CLIP GOES HERE</div></div></div>
</div>
<script src="boxes.js"></script>
<script src="scenes.js"></script>
</body></html>
